name: Reproducibility Hash Tracker

on:
  push:
    branches:
      - machinelearning
  pull_request:
    branches:
      - machinelearning

jobs:
  track-hashes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate SHA-256 Hashes and Generate Report
        run: |
          echo "### 🔐 Reproducibility File Hashes" >> $GITHUB_STEP_SUMMARY
          echo "These hashes guarantee the exact cryptographic state of the ML outputs for this commit." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | SHA-256 Hash |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------------|" >> $GITHUB_STEP_SUMMARY
          
          # Define the files with their full paths relative to the repository root
          FILES=(
            "(Step 3) Machine Learning Estimations/ML Outputs/best_ml_model.rds"
            "(Step 3) Machine Learning Estimations/ML Outputs/ACS_SIPP_8Model_Predictions.csv"
          )
          
          # Loop through and hash each file if it exists in the commit
          for file in "${FILES[@]}"; do
            if [ -f "$file" ]; then
              HASH=$(sha256sum "$file" | awk '{print $1}')
              # Use basename to just show the file name in the table for a cleaner look
              FILENAME=$(basename "$file")
              echo "| \`$FILENAME\` | \`$HASH\` |" >> $GITHUB_STEP_SUMMARY
            else
              FILENAME=$(basename "$file")
              echo "| \`$FILENAME\` | *File not found in this commit* |" >> $GITHUB_STEP_SUMMARY
            fi
          done
